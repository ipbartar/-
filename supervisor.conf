[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

# بخش MySQL
[program:mysql]
command=/bin/bash -c "mysqld_safe --user=mysql --skip-grant-tables"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/mysql.err.log
stdout_logfile=/var/log/supervisor/mysql.out.log
priority=10
startsecs=5
stopasgroup=true
killasgroup=true

# بخش Apache
[program:apache]
command=/bin/bash -c "source /etc/apache2/envvars && exec apache2 -DFOREGROUND"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/apache.err.log
stdout_logfile=/var/log/supervisor/apache.out.log
priority=20
startsecs=5

# بخش Cron برای تسک‌های زمان‌بندی
[program:cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/cron.err.log
stdout_logfile=/var/log/supervisor/cron.out.log
priority=30

# بخش برای اسکریپت Bot
[program:mirza-bot-worker]
command=/bin/bash -c "sleep 30 && while true; do php /var/www/html/mirzaprobotconfig/worker.php; sleep 5; done"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/bot-worker.err.log
stdout_logfile=/var/log/supervisor/bot-worker.out.log
priority=40
startsecs=30
stopasgroup=true
killasgroup=true
